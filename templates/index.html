<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">₹</span>
        <span class="logo-text">ExpenseTracker</span>
      </div>
      <div class="total-pill">
        Total: <strong id="total-amount">₹0.00</strong>
      </div>
    </div>
  </header>

  <!-- ── Main Layout ────────────────────────────────────── -->
  <main>

    <!-- LEFT: Add Expense Form -->
    <section class="card form-card">
      <h2 class="card-title">Add Expense</h2>

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Groceries" />
      </div>

      <div class="form-group">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" placeholder="e.g. 500" min="0" step="0.01" />
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="">-- Select --</option>
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚌 Transport</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Health">💊 Health</option>
          <option value="Entertainment">🎮 Entertainment</option>
          <option value="Bills">💡 Bills</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" />
      </div>

      <button id="add-btn" onclick="addExpense()">+ Add Expense</button>
      <div id="form-message"></div>
    </section>

    <!-- RIGHT: Summary + Table -->
    <section class="right-panel">

      <!-- Summary Pills -->
      <div class="card summary-card">
        <h2 class="card-title">By Category</h2>
        <div id="summary-container" class="summary-pills">
          <span class="empty-hint">No data yet.</span>
        </div>
      </div>

      <!-- Expenses Table -->
      <div class="card table-card">
        <div class="table-header">
          <h2 class="card-title">All Expenses</h2>
          <input type="text" id="filter-input" placeholder="🔍 Search..." oninput="filterExpenses()" />
        </div>

        <div class="table-wrapper">
          <table id="expense-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Del</th>
              </tr>
            </thead>
            <tbody id="expense-body">
              <!-- Rows inserted by JS -->
            </tbody>
          </table>
          <div id="empty-state" class="empty-state">No expenses yet. Add one!</div>
        </div>
      </div>

    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
